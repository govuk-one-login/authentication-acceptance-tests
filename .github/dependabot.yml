version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 1,15 * *"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    ignore:
      - dependency-name: "org.seleniumhq.selenium:selenium-java"
        versions: [ "> 4.11.0" ]
      - dependency-name: "gradle"
        versions: [ "[9.0,)" ]
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "*selenium*"
        update-types:
          - "minor"
          - "patch"
    target-branch: main
    commit-message:
      prefix: BAU
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 3 1,15 * *"
    open-pull-requests-limit: 10
    groups:
      gha-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    target-branch: main
    commit-message:
      prefix: BAU
